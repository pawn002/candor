name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-tokens:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20, 22]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}
      - run: npm ci
      - run: npm run build:tokens

  build-web-components:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20, 22]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}
      - run: npm ci
      - run: npm run build:wc

  accessibility:
    # Keyboard / focus / ARIA behaviour the visual gate (Chromatic) can't see.
    # Playwright's webServer config auto-starts Storybook on :6006.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:playwright

  chromatic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # TurboSnap needs full git history to diff against the baseline
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm ci
      # Official Chromatic action. TurboSnap (onlyChanged) snapshots only the
      # stories affected by the diff — full builds still run on main and when
      # Chromatic detects a dependency/config change that invalidates the graph.
      # PRs report diffs without blocking; main fails on unreviewed changes.
      - uses: chromaui/action@v18
        with:
          projectToken: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}
          onlyChanged: true
          exitZeroOnChanges: ${{ github.event_name == 'pull_request' }}
