name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-tokens:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20, 22]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}
      - run: npm ci
      - run: npm run build:tokens

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm ci
      # Neither build type-checks: Vite transpiles without checking, and
      # build-storybook does not either. So without this job a type error sits in
      # the tree unread — which is how #237 shipped a broken `types` entry while
      # the compiler was naming the exact fix on line 10 of vite.wc.config.ts.
      #
      # This also gates tests/event-types.test-d.ts, which asserts the typed
      # addEventListener overloads with `@ts-expect-error`. That file has no
      # runtime; `tsc` IS its assertion, and it fails in both directions — if an
      # overload stops rejecting a removed event name, the directive goes unused
      # and the build fails on that. Without this job that guard executes never.
      - run: npm run typecheck

  # Both colour audits, in the one order that makes either of them mean
  # anything. audit:tokens owns the sRGB gamut invariant (#225); audit:contrast
  # owns contrast (#211). They run on every PR so each guarantee is a gate
  # rather than a convention someone remembers — an audit is only as good as
  # the odds it gets invoked.
  #
  # audit:contrast was held out of CI while it exited non-zero on two genuine
  # failures (#208, #209) — a job red for a known reason trains people to
  # ignore it. Both are closed, so it comes in.
  #
  # THE STEP ORDER IS LOAD-BEARING, and not merely because gamut is logically
  # prior. audit:contrast reads audit/tokens.dtcg.json off disk, so run on its
  # own it measures the *committed* artifact rather than the current tokens.
  # Verified: change a token without re-exporting and audit:contrast alone
  # reports "✓ no drift", exit 0, while 19 real violations sit in the tree —
  # including the changed token's own recorded figure. Re-export first and the
  # same tree fails with all 19 named. A parallel job would have been a false
  # green, which is the #218 shape once more: a guard that passes because it
  # measured the wrong thing.
  #
  # So this is one job, not two. Splitting it for a finer red/green signal
  # would put audit:contrast back on the committed artifact — the separation
  # people would want is exactly the thing that breaks it.
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm ci
      # Pinned to the major the repo's version guards require. A klar 4
      # release must not reach CI silently — see the checklist in
      # scripts/check-contrast.js.
      - run: npm i -g klar-cli@3
      - run: npm run audit:tokens
      # audit:tokens regenerates the DTCG artifact. If that produces a diff,
      # the committed artifact was stale — someone changed a token and did not
      # re-export, so every downstream figure was measured against the old set.
      #
      # This gate is also what lets the contrast step below trust what it
      # reads: once the regenerated artifact matches the committed one, the
      # file on disk describes the tokens in this commit.
      - name: audit/tokens.dtcg.json is up to date
        run: git diff --exit-code -- audit/tokens.dtcg.json
      # Pairings against their floors, plus every OKCA figure recorded in a
      # token comment or story prose, plus the 14px text floor. Exit 1 is a
      # violation; exit 2 means the audit could not be trusted to run (klar
      # missing, wrong major, or a colour outside sRGB — a defect the step
      # above should already have caught).
      #
      # ~250 klar invocations, so this is the slowest step here by some way
      # (about a minute). That is the cost of measuring rather than asserting.
      - run: npm run audit:contrast

  build-web-components:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20, 22]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}
      - run: npm ci
      - run: npm run build:wc
      # Gates what the published packages *declare* against what their built
      # artifacts *reference*. It lives here rather than in the `audit` job
      # because it reads web-components/dist, which is gitignored and therefore
      # only exists after the build step above.
      #
      # An undeclared import cannot fail anywhere else: this repo hoists every
      # package into one node_modules, so a missing declaration resolves fine
      # here and breaks only in a consumer's clean install (#254).
      - run: npm run audit:packaging

  accessibility:
    # Keyboard / focus / ARIA behaviour the visual gate (Chromatic) can't see.
    # Playwright's webServer config auto-starts Storybook on :6006.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:playwright

  chromatic:
    runs-on: ubuntu-latest
    # GitHub withholds repository secrets from Dependabot-triggered runs, so on a
    # Dependabot PR this job can only fail with "Missing project token" — 15
    # seconds in, having snapshotted nothing. That red says nothing about the
    # bump, and a check that always fails for a reason unrelated to the change is
    # noise that trains people to ignore the column.
    #
    # Skipping it does NOT mean dependency updates go un-diffed. It means they
    # are not diffed *here*: the policy is that Dependabot PRs are notifications,
    # and the updates land through a human-authored batch PR where the secret
    # exists and the visual diff gets a real review. Read this as the other half
    # of the skip, because merging a Dependabot PR directly would bypass the
    # visual gate entirely — autoAcceptChanges below is true on main, so whatever
    # a Storybook bump changed would become the new baseline with nobody having
    # looked at it. Batching also costs one Chromatic build per round instead of
    # one per bump.
    #
    # The alternative was a Dependabot-scoped copy of the token. Rejected: `npm
    # ci` runs dependency install scripts in this same job, so a compromised
    # version of any transitive dev dependency — the exact thing these PRs
    # change — would execute alongside a write-scoped project token.
    if: github.actor != 'dependabot[bot]'
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # TurboSnap needs full git history to diff against the baseline
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm ci
      # Official Chromatic action. TurboSnap (onlyChanged) snapshots only the
      # stories affected by the diff — full builds still run on main and when
      # Chromatic detects a dependency/config change that invalidates the graph.
      #
      # The PR build is the review gate: it reports diffs without blocking, and
      # accepting them there is what approves them. The main build only records
      # that approval as the new baseline, so it auto-accepts.
      #
      # main cannot re-check the diffs itself. Candor merges squash-only, so the
      # branch commits are not ancestors of the commit that lands on main, and
      # Chromatic — which finds a baseline by walking git ancestry — cannot reach
      # the accepted PR build. It falls back to main's previous build and reports
      # every already-approved diff as new. Failing main on that does not catch
      # unreviewed changes; it re-asks a question answered one commit earlier and
      # fails because nobody answers it twice. That left main red from Aug 1 to
      # Aug 3, which is worse than ungated: a real breakage on main was
      # indistinguishable from the standing failure (#232).
      - uses: chromaui/action@v18
        with:
          projectToken: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}
          onlyChanged: true
          exitZeroOnChanges: ${{ github.event_name == 'pull_request' }}
          autoAcceptChanges: ${{ github.ref == 'refs/heads/main' }}
