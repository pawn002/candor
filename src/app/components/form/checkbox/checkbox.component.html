<label [for]="checkboxId" [class]="'checkbox-wrapper' + (disabled ? ' checkbox-wrapper--disabled' : '')">
  <input
    type="checkbox"
    [id]="checkboxId"
    [checked]="checked"
    [disabled]="disabled"
    class="checkbox-input"
    (change)="onCheckboxChange($event)"
    (blur)="onBlur()"
  />
  <span class="checkbox-box"></span>
  <span class="checkbox-label">{{ label }}</span>
</label>
