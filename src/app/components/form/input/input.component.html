<div class="input-wrapper">
  @if (label()) {
    <label [for]="inputId" class="input-label">
      {{ label() }}
      @if (required()) {
        <span class="input-required" aria-hidden="true">*</span>
      }
    </label>
  }

  <input
    [id]="inputId"
    [type]="type()"
    [attr.placeholder]="placeholder() || null"
    [disabled]="disabled"
    [required]="required()"
    [value]="value"
    [class]="'input' + (error() ? ' input--error' : '') + (disabled ? ' input--disabled' : '')"
    [attr.aria-invalid]="error() ? 'true' : null"
    [attr.aria-describedby]="inputId + '-description'"
    (input)="onInput($event)"
    (blur)="onBlur()"
  />

  <!-- Always in DOM so aria-live fires on content change (conditionally rendered live regions
       miss the initial mutation). Empty when no error or hint — aria-describedby reads nothing. -->
  <div
    [id]="inputId + '-description'"
    class="input-description"
    aria-live="polite"
    aria-atomic="true"
  >
    @if (error()) {
      <span class="input-error-message">{{ error() }}</span>
    }
    @if (!error() && hint()) {
      <span class="input-hint">{{ hint() }}</span>
    }
  </div>
</div>
