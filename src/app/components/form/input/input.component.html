<div class="input-wrapper">
  <label *ngIf="label" [for]="inputId" class="input-label">
    {{ label }}
    <span *ngIf="required" class="input-required" aria-label="required">*</span>
  </label>

  <input
    [id]="inputId"
    [type]="type"
    [placeholder]="placeholder"
    [disabled]="disabled"
    [required]="required"
    [value]="value"
    [class]="'input' + (error ? ' input--error' : '') + (disabled ? ' input--disabled' : '')"
    [attr.aria-invalid]="error ? 'true' : null"
    [attr.aria-describedby]="(error || hint) ? inputId + '-description' : null"
    (input)="onInput($event)"
    (blur)="onBlur()"
  />

  <div *ngIf="error || hint" [id]="inputId + '-description'" class="input-description">
    <span *ngIf="error" class="input-error-message">{{ error }}</span>
    <span *ngIf="!error && hint" class="input-hint">{{ hint }}</span>
  </div>
</div>
