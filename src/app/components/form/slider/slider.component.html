@if (label) {
  <label [for]="sliderId" class="slider__label">{{ label }}</label>
}

<div
  class="slider__track"
  [style.background]="gradient ?? null"
>
  <input
    [id]="sliderId"
    class="slider__input"
    type="range"
    [min]="min"
    [max]="max"
    [step]="step"
    [value]="value"
    [disabled]="disabled"
    (input)="onInput($event)"
  />
</div>
