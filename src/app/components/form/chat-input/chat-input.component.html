<div class="chat-input">
  <label [for]="inputId" class="chat-input__label">{{ label() }}</label>

  <!-- sr-only keyboard instructions — always in DOM, referenced by aria-describedby -->
  <span [id]="inputId + '-hint'" class="sr-only">Press Enter to send. Press Shift+Enter for a new line.</span>

  <div class="chat-input__field" [class.chat-input__field--disabled]="disabled()">
    <textarea
      #textarea
      [id]="inputId"
      class="chat-input__textarea"
      [placeholder]="placeholder()"
      [disabled]="disabled()"
      [value]="value"
      [attr.aria-describedby]="ariaDescribedBy()"
      (input)="onInput($event)"
      (keydown)="onKeydown($event)"
      rows="1"
    ></textarea>

    <button
      type="button"
      class="chat-input__send"
      [disabled]="disabled() || !value.trim()"
      (click)="onSend()"
      aria-label="Send message"
    >
      <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <line x1="12" y1="19" x2="12" y2="5"/>
        <polyline points="5 12 12 5 19 12"/>
      </svg>
    </button>
  </div>

  @if (disclaimer()) {
    <p [id]="inputId + '-disclaimer'" class="chat-input__disclaimer">{{ disclaimer() }}</p>
  }

  <!-- Send confirmation live region — always in DOM so mutation fires reliably -->
  <span role="status" class="sr-only" aria-live="polite" aria-atomic="true">{{ statusMessage() }}</span>
</div>
