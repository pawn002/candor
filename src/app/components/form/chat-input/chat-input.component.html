<div class="chat-input">
  <label [for]="inputId" class="chat-input__label">{{ label }}</label>

  <div class="chat-input__field" [class.chat-input__field--disabled]="disabled">
    <textarea
      #textarea
      [id]="inputId"
      class="chat-input__textarea"
      [placeholder]="placeholder"
      [disabled]="disabled"
      [value]="value"
      (input)="onInput($event)"
      (keydown)="onKeydown($event)"
      rows="1"
      aria-multiline="true"
    ></textarea>

    <button
      type="button"
      class="chat-input__send"
      [disabled]="disabled || !value.trim()"
      (click)="onSend()"
      aria-label="Send message"
    >
      <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <line x1="12" y1="19" x2="12" y2="5"/>
        <polyline points="5 12 12 5 19 12"/>
      </svg>
    </button>
  </div>

  @if (disclaimer) {
    <p class="chat-input__disclaimer">{{ disclaimer }}</p>
  }
</div>
