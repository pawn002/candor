<div class="accordion-item" [class.accordion-item--expanded]="expanded">

  <h3 class="accordion-item__heading">
    <button
      class="accordion-item__trigger"
      [id]="headerId"
      [attr.aria-expanded]="expanded"
      [attr.aria-controls]="panelId"
      type="button"
      (click)="toggle()"
    >
      <span class="accordion-item__title">{{ title }}</span>
      <svg
        class="accordion-item__chevron"
        aria-hidden="true"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
      >
        <polyline points="6 9 12 15 18 9"/>
      </svg>
    </button>
  </h3>

  <div
    class="accordion-item__panel"
    [id]="panelId"
    role="region"
    [attr.aria-labelledby]="headerId"
  >
    <div class="accordion-item__panel-inner">
      <div class="accordion-item__content">
        <ng-content></ng-content>
      </div>
    </div>
  </div>

</div>
